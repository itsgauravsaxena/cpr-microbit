site_name: Coding Pirates Rødovre · micro:bit
site_description: All micro:bit teaching material for the Coding Pirates Rødovre micro:bit hold — English & Danish, organized by term
site_url: https://itsgauravsaxena.github.io/cpr-microbit/
repo_url: https://github.com/itsgauravsaxena/cpr-microbit
repo_name: itsgauravsaxena/cpr-microbit
edit_uri: edit/main/microbit-program/

# Keep the existing repo layout: the week folders ARE the docs.
docs_dir: microbit-program
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

# Don't publish the code/ drop-zone placeholder pages as site pages;
# the exported .hex / link files in those folders are still copied through.
exclude_docs: |
  **/code/README.md
  # Old empty terms — hidden from the site (kept in the repo).
  autumn-2025/
  spring-2026/
  # Quiz is teacher-only: keep the questions/answers and import sheets out of
  # the public site. Source stays in the repo; the Kahoot hook reads
  # quiz/kahoots.txt from source, not the built site.
  autumn-2026/quiz/

# Retired pinball course: hidden from the nav tree but still built and
# reachable via the "Archive" link on the autumn-2026 overview page.
not_in_nav: |
  autumn-2026/archive/**

# Registers the reusable ```makecode fenced block (see the file for usage).
hooks:
  - scripts/makecode_hooks.py

plugins:
  - search:
      lang:
        - en
        - da
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: da
          name: Dansk
          build: true

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.magiclink
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Autumn 2026:
      - Overview: autumn-2026/README.md
      - "micro:bit Beginners":
          - Overview: autumn-2026/microbit-beginners/README.md
          - "Week 1 · Flashing Heart": autumn-2026/microbit-beginners/week-01-flashing-heart/README.md
          - "Week 2 · Name Tag + Smiley Buttons": autumn-2026/microbit-beginners/week-02-name-tag-smiley-buttons/README.md
          - "Week 3 · Dice + Love Meter": autumn-2026/microbit-beginners/week-03-dice-love-meter/README.md
          - "Week 4 · Guess! + Reaction Time": autumn-2026/microbit-beginners/week-04-guess-reaction-time/README.md
          - "Week 5 · Ticklebot build & wire": autumn-2026/microbit-beginners/week-05-ticklebot-build-wire/README.md
          - "Week 6 · Ticklebot finish & personalize": autumn-2026/microbit-beginners/week-06-ticklebot-finish-personalize/README.md
          - "Week 7 · Micro Chat": autumn-2026/microbit-beginners/week-07-micro-chat/README.md
          - "Week 8 · Heartbeat Beacon": autumn-2026/microbit-beginners/week-08-heartbeat-beacon/README.md
          - "Week 9 · Step Counter + Coin Toss": autumn-2026/microbit-beginners/week-09-step-counter-coin-toss/README.md
          - "Week 10 · Showcase": autumn-2026/microbit-beginners/week-10-showcase/README.md
      - "micro:bit Pro":
          - Overview: autumn-2026/microbit-pro/README.md
          - "Week 1 · Pinball scoreboard": autumn-2026/microbit-pro/week-01-kickoff-challenge/README.md
          - "Week 2 · Data & sensors": autumn-2026/microbit-pro/week-02-data-sensors/README.md
          - "Week 3 · Tilt maze": autumn-2026/microbit-pro/week-03-tilt-maze/README.md
          - "Week 4 · Sound lab": autumn-2026/microbit-pro/week-04-sound-lab/README.md
          - "Week 5 · Radio duel": autumn-2026/microbit-pro/week-05-radio-duel/README.md
          - "Week 6 · Radio multiplayer": autumn-2026/microbit-pro/week-06-radio-multiplayer/README.md
          - "Week 7 · Digital pet": autumn-2026/microbit-pro/week-07-digital-pet/README.md
          - "Week 8 · Motion instrument": autumn-2026/microbit-pro/week-08-motion-instrument/README.md
          - "Week 9 · Capstone design": autumn-2026/microbit-pro/week-09-capstone-design/README.md
          - "Week 10 · Finish & showcase": autumn-2026/microbit-pro/week-10-showcase/README.md
  - Spring 2027: spring-2027/README.md
