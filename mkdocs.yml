site_name: Coding Pirates Rødovre · micro:bit
site_description: All micro:bit teaching material for the Coding Pirates Rødovre micro:bit hold — English & Danish, organized by term
site_url: https://itsgauravsaxena.github.io/cpr-microbit/
repo_url: https://github.com/itsgauravsaxena/cpr-microbit
repo_name: itsgauravsaxena/cpr-microbit
edit_uri: edit/main/microbit-program/

# Keep the existing repo layout: the week folders ARE the docs.
docs_dir: microbit-program
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

# Don't publish the code/ drop-zone placeholder pages as site pages;
# the exported .hex / link files in those folders are still copied through.
exclude_docs: |
  **/code/README.md

plugins:
  - search:
      lang:
        - en
        - da
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: da
          name: Dansk
          build: true

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.magiclink
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Autumn 2025: autumn-2025/README.md
  - Spring 2026: spring-2026/README.md
  - Autumn 2026:
      - Overview: autumn-2026/README.md
      - "Group A — Startup":
          - Overview: autumn-2026/group-a-startup/README.md
          - "Week 1 · Flashing Heart": autumn-2026/group-a-startup/week-01-flashing-heart/README.md
          - "Week 2 · Name Tag + Smiley Buttons": autumn-2026/group-a-startup/week-02-name-tag-smiley-buttons/README.md
          - "Week 3 · Dice + Love Meter": autumn-2026/group-a-startup/week-03-dice-love-meter/README.md
          - "Week 4 · Guess! + Reaction Time": autumn-2026/group-a-startup/week-04-guess-reaction-time/README.md
          - "Week 5 · Ticklebot build & wire": autumn-2026/group-a-startup/week-05-ticklebot-build-wire/README.md
          - "Week 6 · Ticklebot finish & personalize": autumn-2026/group-a-startup/week-06-ticklebot-finish-personalize/README.md
          - "Week 7 · Micro Chat": autumn-2026/group-a-startup/week-07-micro-chat/README.md
          - "Week 8 · Heartbeat Beacon": autumn-2026/group-a-startup/week-08-heartbeat-beacon/README.md
          - "Week 9 · Step Counter + Coin Toss": autumn-2026/group-a-startup/week-09-step-counter-coin-toss/README.md
          - "Week 10 · Showcase": autumn-2026/group-a-startup/week-10-showcase/README.md
      - "Group B — Advanced Pinball":
          - Overview: autumn-2026/group-b-advanced-pinball/README.md
          - "Week 1 · Kickoff & recap": autumn-2026/group-b-advanced-pinball/week-01-kickoff/README.md
          - "Week 2 · Scoring basics": autumn-2026/group-b-advanced-pinball/week-02-scoring-basics/README.md
          - "Week 3 · Launcher/flipper trigger": autumn-2026/group-b-advanced-pinball/week-03-launcher-trigger/README.md
          - "Week 4 · Multi-sensor + game over": autumn-2026/group-b-advanced-pinball/week-04-multi-sensor-scoring/README.md
          - "Week 5 · Tinkercad first steps": autumn-2026/group-b-advanced-pinball/week-05-tinkercad-basics/README.md
          - "Week 6 · Design a bumper": autumn-2026/group-b-advanced-pinball/week-06-tinkercad-playfield/README.md
          - "Week 7 · Sensor mount": autumn-2026/group-b-advanced-pinball/week-07-sensor-mount/README.md
          - "Week 8 · Finish & print prep": autumn-2026/group-b-advanced-pinball/week-08-design-finish/README.md
          - "Week 9 · Assembly + playtest": autumn-2026/group-b-advanced-pinball/week-09-assembly-playtest/README.md
          - "Week 10 · Polish & showcase": autumn-2026/group-b-advanced-pinball/week-10-showcase-tournament/README.md
  - Spring 2027: spring-2027/README.md
