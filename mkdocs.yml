site_name: Coding Pirates Rødovre · micro:bit
site_description: All micro:bit teaching material for the Coding Pirates Rødovre micro:bit hold — English & Danish, organized by term
site_url: https://itsgauravsaxena.github.io/cpr-microbit/
repo_url: https://github.com/itsgauravsaxena/cpr-microbit
repo_name: itsgauravsaxena/cpr-microbit
edit_uri: edit/main/microbit-program/

# Keep the existing repo layout: the week folders ARE the docs.
docs_dir: microbit-program
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

# Don't publish the code/ drop-zone placeholder pages as site pages;
# the exported .hex / link files in those folders are still copied through.
exclude_docs: |
  **/code/README.md
  # Old empty terms — hidden from the site (kept in the repo).
  autumn-2025/
  spring-2026/
  # Quiz is teacher-only: keep the questions/answers and import sheets out of
  # the public site. Source stays in the repo; the Kahoot hook reads
  # quiz/kahoots.txt from source, not the built site.
  autumn-2026/quiz/
  # Only Weeks 1–2 are live for now — hide Weeks 3–10 until we get there.
  autumn-2026/microbit-beginners/week-0[3-9]*/
  autumn-2026/microbit-beginners/week-10*/
  autumn-2026/microbit-pro/week-0[3-9]*/
  autumn-2026/microbit-pro/week-10*/

# Retired pinball course: hidden from the nav tree but still built and
# reachable via the "Archive" link on the autumn-2026 overview page.
not_in_nav: |
  autumn-2026/archive/**

# Registers the reusable ```makecode fenced block (see the file for usage).
hooks:
  - scripts/makecode_hooks.py

plugins:
  - search:
      lang:
        - en
        - da
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: da
          name: Dansk
          build: true

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.magiclink
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: README.md
  - Autumn 2026:
      - Overview: autumn-2026/README.md
      - "🔧 Meet the gear": autumn-2026/gear/README.md
      - "micro:bit Beginners":
          - Overview: autumn-2026/microbit-beginners/README.md
          - "Week 1 · Flashing Heart": autumn-2026/microbit-beginners/week-01-flashing-heart/README.md
          - "Week 2 · Button Faces": autumn-2026/microbit-beginners/week-02-name-tag-smiley-buttons/README.md
      - "micro:bit Pro":
          - Overview: autumn-2026/microbit-pro/README.md
          - "🎯 The pinball project": autumn-2026/pinball/README.md
          - "Week 1 · Flashing Heart": autumn-2026/microbit-pro/week-01-kickoff-challenge/README.md
          - "Week 2 · Pinball scoreboard": autumn-2026/microbit-pro/week-02-data-sensors/README.md
  - Spring 2027: spring-2027/README.md
